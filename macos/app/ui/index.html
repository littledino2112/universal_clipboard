<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Clipboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="panel">
    <header>
      <div class="status-row">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">Starting...</span>
      </div>
      <div class="device-name" id="deviceName"></div>
    </header>

    <section class="pairing-section">
      <div class="section-label">Pairing Code</div>
      <div class="pairing-code" id="pairingCode">------</div>
      <div class="pairing-hint">Enter this code on the connecting device</div>
    </section>

    <section class="connection-section" id="connectionSection" style="display:none">
      <div class="section-label">Connected</div>
      <div class="connected-device" id="connectedDevice"></div>
    </section>

    <section class="connect-section" id="connectSection">
      <div class="section-label connect-toggle" id="connectToggle">Connect to Mac <span class="toggle-arrow" id="toggleArrow">&#9662;</span></div>
      <div class="connect-form" id="connectForm" style="display:none">
        <input type="text" class="connect-input" id="connectHost" placeholder="IP address or hostname">
        <input type="text" class="connect-input connect-input-short" id="connectPort" placeholder="Port" value="9876">
        <input type="text" class="connect-input" id="connectPairingCode" placeholder="Pairing code (first time only)">
        <div class="connect-actions">
          <button class="connect-btn" id="connectBtn">Connect</button>
          <span class="connect-status" id="connectStatus"></span>
        </div>
      </div>
    </section>

    <section class="clipboard-section">
      <div class="section-label">Clipboard</div>
      <div class="clipboard-header">
        <div class="paste-buttons">
          <button class="paste-btn" id="pasteBtn">Paste Text</button>
          <button class="paste-btn paste-image-btn" id="pasteImageBtn">Paste Image</button>
        </div>
        <span class="clip-count" id="clipCount">0/5</span>
      </div>
      <div id="transferProgress" class="transfer-progress hidden">
        <div class="transfer-progress-label" id="transferLabel">Preparing image...</div>
        <div class="transfer-progress-bar"><div class="transfer-progress-fill" id="transferFill"></div></div>
      </div>
      <div class="clipboard-list" id="clipboardList">
        <div class="empty-state">No clipboard items</div>
      </div>
    </section>

    <section class="devices-section">
      <div class="section-label">Paired Devices</div>
      <div class="devices-list" id="devicesList">
        <div class="empty-state">No paired devices</div>
      </div>
    </section>

    <footer>
      <span class="port-info" id="portInfo"></span>
    </footer>
  </div>
  <script src="main.js"></script>
</body>
</html>
